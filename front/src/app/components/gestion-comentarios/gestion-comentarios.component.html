<div class="wrap wrap-narrow page">
  <header class="page-head"><h1 class="h1">{{ 'gestionComentarios' | translate }}</h1></header>
  @if (comentarios?.length) {
    <ul class="panel">
      @for (comentario of comentarios; track comentario._id) {
        <li class="row-item">
          <div class="row-body">
            <p class="h4">{{ comentario.nombreUsuario }}</p>
            <p class="muted">{{ comentario.texto }}</p>
            <p class="small when">{{ comentario.fecha | date }}</p>
          </div>
          <button type="button" class="btn btn-danger btn-sm" [attr.aria-label]="'Delete' | translate" (click)="borrarComentario(comentario._id)"><i class="fa-solid fa-trash-can"></i></button>
        </li>
      }
    </ul>
  } @else {
    <p class="empty">{{ 'NoCommentsYet' | translate }}</p>
  }
</div>
